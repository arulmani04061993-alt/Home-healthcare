<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | STACKLY Home Healthcare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <div class="container py-5">
        <div class="auth-container" style="max-width: 600px; margin: 0 auto; min-height: auto;">
            <div class="auth-form-side" style="width: 100%;">
                <div class="text-center mb-5">
                    <a href="index.html" class="auth-logo justify-content-center">
                        <i class="bi bi-heart-pulse-fill"></i>
                        STACKLY
                    </a>
                </div>
                
                <h3 class="auth-title text-center">Reset Password</h3>
                <p class="auth-subtitle text-center">Enter your email address and we'll send you a link to reset your password.</p>
                
                <form id="resetForm" onsubmit="event.preventDefault(); alert('Reset link sent to your email.'); window.location.href='login.html';">
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Email Address</label>
                        <input type="email" class="form-control form-control-lg" placeholder="johndoe@example.com" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">SEND RESET LINK</button>
                    
                    <div class="text-center">
                        <a href="login.html" class="text-primary fw-bold text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
