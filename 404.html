<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Let's Reconnect | STACKLY Home Healthcare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #102A43;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }
        
        .pulse-svg {
            width: 200px;
            height: auto;
        }
        
        .pulse-line {
            fill: none;
            stroke: #00d8c0;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: heartbeat 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            filter: drop-shadow(0 0 3px rgba(0, 216, 192, 0.5));
        }
        
        @keyframes heartbeat {
            0% { stroke-dashoffset: 1000; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -1000; }
        }

        body {
            background-color: #fce1ba;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow-x: hidden;
        }
        .error-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        .error-code {
            font-size: 14rem;
            font-weight: 800;
            color: #03435e;
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -5px;
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #03435e;
            margin-bottom: 1.5rem;
        }
        .error-desc {
            font-size: 1rem;
            color: #333;
            max-width: 450px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-weight: 500;
        }
        .btn-home {
            background-color: #ff5757;
            color: #fff;
            padding: 14px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-home:hover {
            background-color: #e04848;
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-outline-home {
            background-color: transparent;
            color: #ff5757;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 2px solid #ff5757;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-outline-home:hover {
            background-color: #ff5757;
            color: #fff;
            transform: translateY(-2px);
        }
        .illustration-container {
            position: relative;
            z-index: 1;
        }
        .illustration-container img {
            width: 100%;
            max-width: 650px;
            mix-blend-mode: multiply;
        }
        /* Background decor shape */
        .bg-shape {
            position: absolute;
            right: -10%;
            top: -10%;
            width: 70vw;
            height: 120vh;
            background-color: #faebce;
            border-radius: 50%;
            z-index: 0;
        }
        @media (max-width: 991px) {
            .error-code { font-size: 8rem; }
            .error-title { font-size: 2rem; }
            .error-container { text-align: center; }
            .error-desc { margin: 0 auto 2rem auto; }
            .bg-shape { display: none; }
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div id="preloader"><div class="preloader-content d-flex flex-column align-items-center"><img src="assets/images/logo.webp" alt="STACKLY" style="width: 200px; height: auto; margin-bottom: -15px; z-index: 2; position: relative;"><svg class="pulse-svg" viewBox="0 0 400 150"><path class="pulse-line" d="M 0 75 L 150 75 C 155 75 155 40 160 40 C 165 40 165 75 170 75 L 172 75 L 175 100 L 178 50 L 183 140 C 185 140 186 60 190 60 C 193 60 195 80 198 80 C 202 80 204 40 208 40 C 212 40 212 75 215 75 L 400 75"></path></svg></div></div>

    <div class="bg-shape"></div>
    <div class="container error-container">
        <div class="row align-items-center">
            <div class="col-lg-6 mb-5 mb-lg-0">
                <div class="error-code">404</div>
                <h1 class="error-title">Let's Reconnect You With<br>Senior Care Solutions.</h1>
                <p class="error-desc">Nam mollis aliquet hendrerit. Interdum et malesuada fames ac ante ipsum primis in faucibus. Curabitur augue purus, cursus efficitur.</p>
                <div class="d-flex flex-wrap gap-3 justify-content-lg-start justify-content-center">
                    <a href="index.html" class="btn-home">Back To Home</a>
                    <button onclick="history.back()" class="btn-outline-home" style="cursor: pointer; background: transparent;">Go Back</button>
                </div>
            </div>
            <div class="col-lg-6 text-center illustration-container">
                <img src="assets/images/global/404_illustration.webp" alt="Caregiver with senior in wheelchair">
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                setTimeout(() => {
                    preloader.style.opacity = '0';
                    setTimeout(() => preloader.style.display = 'none', 300);
                }, 500);
            }
        });
    </script>
</body>
</html>
