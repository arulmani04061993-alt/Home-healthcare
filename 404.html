<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Let's Reconnect | STACKLY Home Healthcare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fce1ba;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow-x: hidden;
        }
        .error-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        .error-code {
            font-size: 14rem;
            font-weight: 800;
            color: #03435e;
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -5px;
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #03435e;
            margin-bottom: 1.5rem;
        }
        .error-desc {
            font-size: 1rem;
            color: #333;
            max-width: 450px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-weight: 500;
        }
        .btn-home {
            background-color: #ff5757;
            color: #fff;
            padding: 14px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-home:hover {
            background-color: #e04848;
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-outline-home {
            background-color: transparent;
            color: #ff5757;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 2px solid #ff5757;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-outline-home:hover {
            background-color: #ff5757;
            color: #fff;
            transform: translateY(-2px);
        }
        .illustration-container {
            position: relative;
            z-index: 1;
        }
        .illustration-container img {
            width: 100%;
            max-width: 650px;
            mix-blend-mode: multiply;
        }
        /* Background decor shape */
        .bg-shape {
            position: absolute;
            right: -10%;
            top: -10%;
            width: 70vw;
            height: 120vh;
            background-color: #faebce;
            border-radius: 50%;
            z-index: 0;
        }
        @media (max-width: 991px) {
            .error-code { font-size: 8rem; }
            .error-title { font-size: 2rem; }
            .error-container { text-align: center; }
            .error-desc { margin: 0 auto 2rem auto; }
            .bg-shape { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-shape"></div>
    <div class="container error-container">
        <div class="row align-items-center">
            <div class="col-lg-6 mb-5 mb-lg-0">
                <div class="error-code">404</div>
                <h1 class="error-title">Let's Reconnect You With<br>Senior Care Solutions.</h1>
                <p class="error-desc">Nam mollis aliquet hendrerit. Interdum et malesuada fames ac ante ipsum primis in faucibus. Curabitur augue purus, cursus efficitur.</p>
                <div class="d-flex flex-wrap gap-3 justify-content-lg-start justify-content-center">
                    <a href="index.html" class="btn-home">Back To Home</a>
                    <button onclick="history.back()" class="btn-outline-home" style="cursor: pointer; background: transparent;">Go Back</button>
                </div>
            </div>
            <div class="col-lg-6 text-center illustration-container">
                <img src="assets/images/global/404_illustration.webp" alt="Caregiver with senior in wheelchair">
            </div>
        </div>
    </div>
</body>
</html>
