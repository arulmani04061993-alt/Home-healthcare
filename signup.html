<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | STACKLY Home Healthcare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <div class="container py-5">
        <div class="auth-container">
            <div class="auth-image-side" style="background: linear-gradient(rgba(46, 159, 138, 0.4), rgba(16, 42, 67, 0.8)), url('assets/images/global/img_1516549655169-df83a0774514.webp') center/cover;">
                <h2 class="display-5 fw-bold text-white mb-4">Join STACKLY Today</h2>
                <p class="fs-5 text-white opacity-75">Create an account to start exploring personalized healthcare options for you or your loved ones.</p>
            </div>
            
            <div class="auth-form-side">
                <a href="index.html" class="auth-logo text-decoration-none">
                    <img src="assets/images/logo.webp" alt="STACKLY Logo" height="50">
                </a>
                
                <h3 class="auth-title">Create an Account</h3>
                <p class="auth-subtitle">Join us to experience compassionate care</p>
                
                <form id="signupForm">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-bold">First Name</label>
                            <input type="text" id="firstNameInput" class="form-control" placeholder="John" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-bold">Last Name</label>
                            <input type="text" id="lastNameInput" class="form-control" placeholder="Doe" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Email Address</label>
                        <input type="email" id="signupEmailInput" class="form-control" placeholder="johndoe@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Sign Up As (Role)</label>
                        <select class="form-select" required>
                            <option value="" disabled selected>Select your role...</option>
                            <option value="doctor">Doctor</option>
                            <option value="patient">Patient</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Password</label>
                        <input type="password" class="form-control" placeholder="********" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="********" required>
                    </div>
                    
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label text-muted" for="terms">
                                I agree to the <a href="terms.html" class="text-primary">Terms & Conditions</a> and <a href="privacy-policy.html" class="text-primary">Privacy Policy</a>
                            </label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">CREATE ACCOUNT</button>
                    
                    <p class="text-center text-muted mb-4">
                        Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login</a>
                    </p>
                    
                    <div class="text-center mt-2 pt-4 border-top">
                        <a href="index.html" class="btn rounded-pill px-4 py-2 text-white d-inline-flex align-items-center justify-content-center" style="background-color: #e63946; font-weight: 500; font-size: 15px; border: none; box-shadow: none;">
                            <i class="bi bi-house-door me-2" style="font-size: 18px;"></i>Go to Home
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstNameInput').value;
            const lastName = document.getElementById('lastNameInput').value;
            const email = document.getElementById('signupEmailInput').value;
            
            // Save to localStorage so login page or dashboard can use it
            localStorage.setItem('signupFirstName', firstName);
            localStorage.setItem('signupLastName', lastName);
            localStorage.setItem('signupEmail', email);
            
            // Redirect to login page
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
