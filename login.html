<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | STACKLY Home Healthcare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <div class="container py-5">
        <div class="auth-container">
            <div class="auth-image-side">
                <h2 class="display-5 fw-bold text-white mb-4">Welcome Back to STACKLY</h2>
                <p class="fs-5 text-white opacity-75">Sign in to manage your care plans, schedule appointments, and access health resources.</p>
            </div>
            
            <div class="auth-form-side">
                <a href="index.html" class="auth-logo d-inline-block mb-4 text-decoration-none">
                    <img src="assets/images/logo.webp" alt="STACKLY Logo" height="50">
                </a>
                
                <h3 class="auth-title">Login to your account</h3>
                <p class="auth-subtitle">Enter your details to proceed further</p>
                
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Login As (Role)</label>
                        <select id="roleSelect" class="form-select form-select-lg" required>
                            <option value="" disabled selected>Select your role...</option>
                            <option value="doctor">Doctor</option>
                            <option value="patient">Patient</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Email Address</label>
                        <input id="emailInput" type="email" class="form-control form-control-lg" placeholder="johndoe@example.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Password</label>
                        <input type="password" class="form-control form-control-lg" placeholder="********" required>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-5">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="forgot-password.html" class="text-primary fw-bold text-decoration-none">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">LOGIN</button>
                    
                    <p class="text-center text-muted mb-4">
                        Don't have an account? <a href="signup.html" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                    </p>
                    
                    <div class="text-center mt-2 pt-4 border-top">
                        <a href="index.html" class="btn rounded-pill px-4 py-2 text-white d-inline-flex align-items-center justify-content-center" style="background-color: #e63946; font-weight: 500; font-size: 15px; border: none; box-shadow: none;">
                            <i class="bi bi-house-door me-2" style="font-size: 18px;"></i>Go to Home
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            const email = document.getElementById('emailInput').value;
            
            const signupEmail = localStorage.getItem('signupEmail');
            let displayName = '';
            
            // Check if user is logging in with the email they just signed up with
            if (signupEmail && email === signupEmail) {
                const firstName = localStorage.getItem('signupFirstName');
                const lastName = localStorage.getItem('signupLastName');
                displayName = firstName + ' ' + lastName;
            } else {
                // Direct login fallback
                if (role === 'doctor') {
                    displayName = 'Doctor';
                } else {
                    displayName = 'Patient';
                }
            }
            
            // Save to localStorage
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userRole', role);
            localStorage.setItem('userDisplayName', displayName);
            
            // Redirect based on role
            if (role === 'doctor') {
                window.location.href = 'doctor-dashboard.html';
            } else if (role === 'patient') {
                window.location.href = 'patient-dashboard.html';
            }
        });
    </script>
</body>
</html>
